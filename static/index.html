<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hangman</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>Hangman</h1>
        <p class="tagline">Guess the word. Six misses and you are out.</p>
      </header>

      <section class="controls" aria-label="Game controls">
        <label>
          Difficulty
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <button id="new-game" type="button">New Game</button>
      </section>

      <section class="board">
        <svg
          id="gallows"
          class="gallows"
          viewBox="0 0 220 260"
          role="img"
          aria-label="Hangman drawing"
        >
          <line class="frame" x1="20" y1="240" x2="140" y2="240" />
          <line class="frame" x1="50" y1="240" x2="50" y2="20" />
          <line class="frame" x1="50" y1="20" x2="150" y2="20" />
          <line class="frame" x1="150" y1="20" x2="150" y2="50" />
          <circle id="part-head" class="part" cx="150" cy="72" r="22" />
          <line id="part-body" class="part" x1="150" y1="94" x2="150" y2="160" />
          <line id="part-arm-l" class="part" x1="150" y1="112" x2="118" y2="140" />
          <line id="part-arm-r" class="part" x1="150" y1="112" x2="182" y2="140" />
          <line id="part-leg-l" class="part" x1="150" y1="160" x2="122" y2="208" />
          <line id="part-leg-r" class="part" x1="150" y1="160" x2="178" y2="208" />
        </svg>

        <div class="status-panel">
          <p id="pattern" class="pattern" aria-live="polite">Press New Game to start</p>
          <p id="message" class="message" aria-live="polite"></p>
          <dl class="stats">
            <div>
              <dt>Remaining misses</dt>
              <dd id="remaining">—</dd>
            </div>
            <div>
              <dt>Guessed</dt>
              <dd id="guessed">—</dd>
            </div>
            <div>
              <dt>Incorrect</dt>
              <dd id="incorrect">—</dd>
            </div>
          </dl>
        </div>
      </section>

      <section id="keyboard" class="keyboard" aria-label="Letter keyboard"></section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
